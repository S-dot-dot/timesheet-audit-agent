<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Finish Line — Timesheet Audit</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
  }
  .card {
    background: #ffffff;
    border-radius: 12px;
    padding: 40px 36px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
    color: #0f172a;
  }
  p.sub {
    margin: 0 0 24px;
    font-size: 14px;
    color: #64748b;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 6px;
  }
  input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 14px;
  }
  input[type="password"]:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
  }
  button {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #94a3b8; cursor: not-allowed; }
  .error {
    color: #dc2626;
    font-size: 13px;
    margin: -6px 0 14px;
    display: none;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Timesheet Audit</h1>
    <p class="sub">Finish Line internal tool. Enter the shared passcode to continue.</p>
    <form id="loginForm">
      <label for="passcode">Passcode</label>
      <input type="password" id="passcode" name="passcode" autofocus required />
      <div class="error" id="errorMsg">Incorrect passcode. Try again.</div>
      <button type="submit" id="submitBtn">Log in</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Checking...';

      const passcode = document.getElementById('passcode').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ passcode }),
        });

        if (res.ok) {
          window.location.href = '/';
        } else {
          errorMsg.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Log in';
        }
      } catch (err) {
        errorMsg.textContent = 'Something went wrong. Try again.';
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
